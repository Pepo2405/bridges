[package]
name = "forge-client"
version = "0.1.0"
description = "Forge — vault de documentación compartido"
authors = ["Forge"]
edition = "2021"

[lib]
name = "forge_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
# Stream SSE desde Rust: el WKWebView no entrega respuestas long-lived al JS.
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package]
name = "bridges-client"
version = "0.1.0"
description = "Bridges — vault de documentación compartido"
authors = ["Bridges"]
edition = "2021"

[lib]
name = "bridges_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
trash = "5"
# Tokens de conexión en el keychain del SO (no en bridges.json en claro).
# apple-native: Keychain real en macOS. En otros SO sin su backend, keyring
# cae a un store en memoria (degradación: no persiste, no crashea).
keyring = { version = "3", features = ["apple-native"] }
# Stream SSE desde Rust: el WKWebView no entrega respuestas long-lived al JS.
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
